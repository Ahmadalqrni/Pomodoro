<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer</title>
    <link rel="stylesheet" href="css/Timer.css" />
    <link rel="stylesheet" href="css/settings.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <a href="index.html"
        ><img
          src="img/study_with_me_logo_transparent.svg"
          alt="Study with me logo"
      /></a>
      <nav id="main_ul">
        <ul>
          <li><a href="timer.html">⏱️Timer</a></li>
          <li><a href="ToDoList.html">✅To-Do List</a></li>
          <li><a href="artwall.html">🎨Art Wall</a></li>
          <li><a href="about.html">👤About</a></li>
          <li><a href="contact.html">📩Contact</a></li>
        </ul>
      </nav>
      <nav id="login_box">
        <ul>
          <li><a href="auth.html">💻Login</a></li>
          <li><a href="auth.html">⭐Signup</a></li>
        </ul>
      </nav>
    </header>
    <video src="vid/focus.mp4" autoplay muted loop playsinline></video>
    <div class="overlay"></div>
    <div id="timerbox">
      <h1 id="titlesession">🍅 Focus Time 🍅</h1>
      <nav id="sesstion">
        <ul>
          <li><button id="sessionfocus" class="active">Focus</button></li>
          <li><button id="sessionshort">Short Break</button></li>
          <li><button id="sessionlong">long Break</button></li>
        </ul>
      </nav>
      <nav id="listbox">
        <ul id="ToDoList"></ul>
      </nav>

      <h2 id="timerdisplay">25:00</h2>
      <button id="startbtn">Start</button>
      <button id="pausebtn">Pause</button>
      <button id="resetbtn">Reset</button>
      <p id="starcount"></p>
    </div>
    <button id="openSettings">⚙️</button>
    <!--INSIDE SETTING BUTTON-->
    <div id="overlay" class="hidden">
      <div id="settingsPanel">
        <button id="closeSettings">×</button>
        <h3>Timer</h3>
        <!-- 🍅 native number-input spin arrows replaced with themed +/- steppers -->
        <label>
          Focus
          <div class="stepper">
            <button type="button" class="step-btn minus" data-target="focusInput">−</button>
            <input type="number" id="focusInput" min="1" max="90" value="25" />
            <button type="button" class="step-btn plus" data-target="focusInput">+</button>
          </div>
        </label>
        <label>
          Short break
          <div class="stepper">
            <button type="button" class="step-btn minus" data-target="shortInput">−</button>
            <input type="number" id="shortInput" min="1" max="30" value="5" />
            <button type="button" class="step-btn plus" data-target="shortInput">+</button>
          </div>
        </label>
        <label>
          Long break
          <div class="stepper">
            <button type="button" class="step-btn minus" data-target="longInput">−</button>
            <input type="number" id="longInput" min="1" max="60" value="15" />
            <button type="button" class="step-btn plus" data-target="longInput">+</button>
          </div>
        </label>
        <!-- 🍅 lets the user apply new timer lengths right away, no page refresh needed -->
        <button id="applySettings">Apply Time</button>
        <h3>Theme</h3>
        <div class="swatches">
          <button
            class="swatch"
            data-color="255, 115, 0"
            style="background: rgb(255, 115, 0)"
          ></button>
          <button
            class="swatch"
            data-color="255, 99, 71"
            style="background: rgb(255, 99, 71)"
          ></button>
          <button
            class="swatch"
            data-color="74, 158, 255"
            style="background: rgb(74, 158, 255)"
          ></button>
          <button
            class="swatch"
            data-color="61, 220, 151"
            style="background: rgb(61, 220, 151)"
          ></button>
        </div>
      </div>
    </div>
    <script src="js/glassAlert.js"></script>
    <!-- 🍅 setting.js must load before timer.js: timer.js calls loadSettings()
         at startup, and script/module tags run in document order -->
    <script src="js/setting.js" defer></script>
    <script type="module" src="js/timer.js"></script>
    <script type="module" src="js/visitTracker.js"></script>
    <script type="module" src="js/authStatus.js"></script>
  </body>
</html>
